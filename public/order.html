<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order · Stripe Demo</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Stripe Demo</a>
    <nav class="nav">
      <a href="/">Shop</a>
      <a href="/orders.html" aria-current="page">Orders</a>
      <a href="/events.html">Events</a>
    </nav>
  </header>
  <main>
    <h1 id="title">Order</h1>
    <p id="error" class="error" role="alert" hidden></p>
    <section id="details" hidden>
      <dl id="fields" class="panel details"></dl>
      <h2>Webhook events</h2>
      <p class="muted">Events that affected this order, in the order they were received.</p>
      <p id="no-events" hidden>No webhook events for this order yet.</p>
      <div class="table-wrap">
        <table id="events" hidden>
          <thead>
            <tr>
              <th>Received</th>
              <th>Type</th>
              <th>Outcome</th>
              <th>Detail</th>
              <th>Stripe created</th>
              <th>Event</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
    <div class="actions"><a class="btn" href="/orders.html">Back to orders</a></div>
  </main>
  <script type="module" src="/order.js"></script>
</body>
</html>
