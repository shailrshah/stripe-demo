<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders · Stripe Demo Shop</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="site-nav">
    <a href="/">Shop</a> · <a href="/orders.html" aria-current="page">Orders</a> · <a href="/events.html">Events</a>
  </nav>
  <main>
    <h1>Orders</h1>
    <p class="note">A refund only asks Stripe to refund the payment. The order becomes <code>refunded</code> when the <code>charge.refunded</code> webhook arrives, so <code>stripe listen</code> must be running.</p>
    <p id="error" class="error" role="alert" hidden></p>
    <p id="empty" hidden>No orders yet. <a href="/">Buy something</a> to create one.</p>
    <div class="table-wrap" style="overflow-x: auto">
      <table id="orders" hidden>
        <thead>
          <tr>
            <th>Order</th>
            <th>Product</th>
            <th>Amount</th>
            <th>Method</th>
            <th>Status</th>
            <th>Stripe object</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
  <script type="module" src="/orders.js"></script>
</body>
</html>
