<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webhook events · Stripe Demo</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Stripe Demo</a>
    <nav class="nav">
      <a href="/">Shop</a>
      <a href="/donate.html">Donate</a>
      <a href="/orders.html">Orders</a>
      <a href="/events.html" aria-current="page">Events</a>
    </nav>
  </header>
  <main>
    <h1>Webhook events</h1>
    <p class="lead">Every verified webhook delivery, newest first, including duplicates and events that changed nothing.</p>
    <div class="toolbar"><button type="button" id="refresh" class="btn btn-sm">Refresh</button> <span id="updated" class="muted"></span></div>
    <p id="error" class="error" role="alert" hidden></p>
    <p id="empty" hidden>No webhook events received yet. Is <code>stripe listen</code> running?</p>
    <div class="table-wrap">
      <table id="events" hidden>
        <thead>
          <tr>
            <th>Received</th>
            <th>Type</th>
            <th>Order</th>
            <th>Outcome</th>
            <th>Detail</th>
            <th>Event</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
  <script type="module" src="/events.js"></script>
</body>
</html>
